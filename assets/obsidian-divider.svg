<svg xmlns="http://www.w3.org/2000/svg" width="900" height="24" viewBox="0 0 900 24" role="img" aria-label="Section divider">
<defs>

<linearGradient id="dl" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#1D1D26" stop-opacity="0"/>
  <stop offset="0.2" stop-color="#1D1D26"/>
  <stop offset="0.8" stop-color="#1D1D26"/>
  <stop offset="1" stop-color="#1D1D26" stop-opacity="0"/>
</linearGradient>

<style>@media(prefers-reduced-motion:reduce){*{animation:none!important}}text{user-select:none}
@keyframes glideR{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(840px);opacity:0}}
@keyframes glideL{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(-840px);opacity:0}}
.pR{animation:glideR 3.4s cubic-bezier(.4,0,.2,1) infinite}
.pL{animation:glideL 3.4s cubic-bezier(.4,0,.2,1) infinite 1.7s}
</style>
</defs>
<rect x="20" y="11.5" width="860" height="1" fill="url(#dl)"/><polygon points="450,7 455,12 450,17 445,12" fill="#0A0A0E" stroke="#2E2E3B" stroke-width="1"/><circle cx="450" cy="12" r="1.5" fill="#10B981"/><g class="pR"><rect x="24" y="11" width="44" height="2" rx="1" fill="#F4F4F6" opacity="0.75"/></g><g class="pL"><rect x="832" y="11" width="44" height="2" rx="1" fill="#10B981" opacity="0.75"/></g>
</svg>